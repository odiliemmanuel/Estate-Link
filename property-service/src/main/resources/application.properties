spring.application.name=property-service
server.port=8082

# Database — values come from .env (see .env.example); no fallback secrets.
spring.datasource.url=${DATABASE_URI}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Shared with user-service — MUST match the JWT_SECRET in user-service/.env
jwt.secret=${JWT_SECRET}

jwt.expiration-ms=86400000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# App
app.base-url=${APP_BASE_URL:http://localhost:8082}

# Uploads — stored on a local volume and served back as static resources
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
upload.dir=${UPLOAD_DIR:${java.io.tmpdir}/estatelink-uploads}

# Eureka discovery
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}