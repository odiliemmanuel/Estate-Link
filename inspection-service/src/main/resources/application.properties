spring.application.name=inspection-service
server.port=8083

# Database — values come from .env (see .env.example); no fallback secrets.
spring.datasource.url=${DATABASE_URI}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Shared with user-service — MUST match the JWT_SECRET in user-service/.env
jwt.secret=${JWT_SECRET}

jwt.expiration-ms=86400000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer for inspection-service events (none internal yet, placeholder for symmetry)
spring.kafka.consumer.group-id=inspection-group
spring.kafka.consumer.auto-offset-reset=earliest

# Eureka discovery
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
