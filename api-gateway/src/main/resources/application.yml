server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/api/v1/properties/**,/api/v1/listings/**,/api/v1/uploads/**
        - id: inspection-service
          uri: lb://inspection-service
          predicates:
            - Path=/api/v1/inspection-slots/**,/api/v1/inspection-requests/**
        - id: offer-service
          uri: lb://offer-service
          predicates:
            - Path=/api/v1/offers/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
